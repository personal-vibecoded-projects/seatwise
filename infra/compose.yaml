name: seatwise
services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm local:configure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm local:configure}
      POSTGRES_DB: seatwise_demo
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run pnpm local:configure}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql
      - ./containers/init-db.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d seatwise_demo']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: { context: .., dockerfile: infra/containers/node.Dockerfile }
    command: ['node', 'dist/packages/db/src/migrate-cli.js']
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/seatwise_demo
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: infra/containers/node.Dockerfile }
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://seatwise_app:${RUNTIME_DB_PASSWORD}@db:5432/seatwise_demo
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:3001/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build: { context: .., dockerfile: infra/containers/node.Dockerfile }
    command: ['node', 'dist/apps/worker/src/main.js']
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://seatwise_app:${RUNTIME_DB_PASSWORD}@db:5432/seatwise_demo
    depends_on: { api: { condition: service_healthy } }
  web:
    build: { context: .., dockerfile: infra/containers/web.Dockerfile }
    ports: ['127.0.0.1:8080:8080']
    depends_on: { api: { condition: service_healthy } }
volumes:
  pgdata:
